[package]
name = "hugr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Project memory and intelligence system for coding agents: semantic code graph, temporal memory, and a context compiler"
repository = "https://github.com/arcbjorn/hugr"
readme = "README.md"
keywords = ["agent", "memory", "mcp", "code-intelligence", "context"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = ["local-embeddings"]
# In-process ONNX text embeddings (fastembed). Disable for a slim binary:
# the deterministic, ollama, and openai providers remain available.
local-embeddings = ["dep:fastembed"]

[dependencies]
fastembed = { version = "5.17.2", optional = true, default-features = false, features = [
    "ort-download-binaries-native-tls",
    "hf-hub-native-tls",
] }
libsql = "0.9.30"
notify = "8.2.0"
regex = "1.12.4"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
tree-sitter = "0.26.10"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.3"
tree-sitter-typescript = "0.23.2"
