name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Run test suite
        run: cargo test

      - name: Run live Hugr API contract smoke
        run: cargo test --test hugr_api_live -- --ignored --nocapture
