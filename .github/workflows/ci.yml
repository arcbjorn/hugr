name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run test suite
        run: cargo test

      - name: Run live Hugr API contract smoke
        run: cargo test --test hugr_api_live -- --ignored --nocapture

  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # The slim build is linted separately so the non-default feature
      # combination cannot rot behind the default one.
      - name: Lint without local embeddings
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Lint with default features
        run: cargo clippy --all-targets -- -D warnings

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cargo.toml advertises rust-version 1.88, so it has to keep building
      # there; nothing else in CI would notice a newly stabilised API or
      # language feature landing in the codebase.
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build against the declared MSRV
        run: cargo check --all-targets

  context-eval:
    name: Context eval baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # Report-only for now: prints retrieval quality against recent commits
      # so ranking regressions are visible in CI logs. A --min-hit-rate gate
      # lands once a stable baseline is established across a few runs.
      - name: Score context retrieval against git history
        run: |
          cargo run --quiet -- init
          cargo run --quiet -- index
          cargo run --quiet -- eval --from-git 30
